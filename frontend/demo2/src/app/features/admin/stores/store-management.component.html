<div class="page-container">
  <div class="page-header">
    <h1>Mağaza Yönetimi</h1>
    <span style="color:#757575">{{ stores.length }} mağaza</span>
  </div>

  @if (loading) {
    <div style="text-align:center;padding:60px"><mat-spinner diameter="50"></mat-spinner></div>
  } @else {
    <div style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06)">
      <table mat-table [dataSource]="stores" style="width:100%">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let s" style="color:#bdbdbd;font-size:0.8rem">{{ s.id }}</td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Mağaza Adı</th>
          <td mat-cell *matCellDef="let s" style="font-weight:600">{{ s.name }}</td>
        </ng-container>
        <ng-container matColumnDef="owner">
          <th mat-header-cell *matHeaderCellDef>Sahip</th>
          <td mat-cell *matCellDef="let s" style="color:#757575">{{ s.ownerEmail ?? s.owner?.email ?? '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Durum</th>
          <td mat-cell *matCellDef="let s">
            <span [style.background]="s.active ? '#e8f5e9' : '#fce4ec'"
                  [style.color]="s.active ? '#2e7d32' : '#c62828'"
                  style="padding:3px 10px;border-radius:20px;font-size:0.8rem;font-weight:600">
              {{ s.active ? 'AKTİF' : 'KAPALI' }}
            </span>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>İşlemler</th>
          <td mat-cell *matCellDef="let s">
            @if (s.active) {
              <button mat-stroked-button color="warn" (click)="closeStore(s)">
                <mat-icon>store</mat-icon> Kapat
              </button>
            } @else {
              <button mat-stroked-button color="primary" (click)="openStore(s)">
                <mat-icon>store</mat-icon> Aç
              </button>
            }
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  }
</div>
