<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="brand">⚙️ ShopPlatform</div>
    <div class="nav-section">Platform Yönetimi</div>
    <a routerLink="dashboard" routerLinkActive="active" class="nav-item">
      <mat-icon>dashboard</mat-icon> Gösterge Paneli
    </a>
    <a routerLink="users" routerLinkActive="active" class="nav-item">
      <mat-icon>group</mat-icon> Kullanıcı Yönetimi
    </a>
    <a routerLink="stores" routerLinkActive="active" class="nav-item">
      <mat-icon>store</mat-icon> Mağaza Yönetimi
    </a>
    <a routerLink="categories" routerLinkActive="active" class="nav-item">
      <mat-icon>category</mat-icon> Kategori Yönetimi
    </a>
    <div class="nav-section">Raporlar</div>
    <a routerLink="audit-logs" routerLinkActive="active" class="nav-item">
      <mat-icon>history</mat-icon> Denetim Günlükleri
    </a>
    <a routerLink="chat" routerLinkActive="active" class="nav-item">
      <mat-icon>smart_toy</mat-icon> AI Asistan
    </a>
    <div class="nav-item" (click)="auth.logout()" style="margin-top:auto;color:#ef9a9a;cursor:pointer">
      <mat-icon>logout</mat-icon> Çıkış Yap
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="main-toolbar">
      <button mat-icon-button (click)="history.back()" title="Geri">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <span style="font-weight:600;color:#1a237e;margin-left:8px">Admin Paneli</span>
      <span style="flex:1"></span>
      <span style="font-size:0.9rem;color:#757575">{{ auth.currentUser()?.email }}</span>
    </mat-toolbar>
    <div class="main-content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
