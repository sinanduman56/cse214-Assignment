<div class="page-container">
  <div class="page-header">
    <h1>Denetim Günlükleri</h1>
    <mat-form-field appearance="outline" style="min-width:240px">
      <mat-label>Ara</mat-label>
      <input matInput [(ngModel)]="searchText" (ngModelChange)="applySearch()" placeholder="Eylem, Varlık, Kullanıcı" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  @if (loading) {
    <div style="text-align:center;padding:60px"><mat-spinner diameter="50"></mat-spinner></div>
  } @else {
    <div style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06)">
      <table mat-table [dataSource]="filtered" style="width:100%">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let l" style="color:#bdbdbd;width:50px;font-size:0.8rem">{{ l.id }}</td>
        </ng-container>
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>Eylem</th>
          <td mat-cell *matCellDef="let l">
            <span style="background:#e8eaf6;color:#3f51b5;padding:3px 8px;border-radius:20px;font-size:0.8rem;font-weight:600">{{ l.action }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="entityType">
          <th mat-header-cell *matHeaderCellDef>Varlık Tipi</th>
          <td mat-cell *matCellDef="let l" style="color:#757575">{{ l.entityType }}</td>
        </ng-container>
        <ng-container matColumnDef="entityId">
          <th mat-header-cell *matHeaderCellDef>Varlık ID</th>
          <td mat-cell *matCellDef="let l" style="color:#757575">{{ l.entityId }}</td>
        </ng-container>
        <ng-container matColumnDef="performedBy">
          <th mat-header-cell *matHeaderCellDef>Yapan</th>
          <td mat-cell *matCellDef="let l" style="font-weight:500">{{ l.performedBy }}</td>
        </ng-container>
        <ng-container matColumnDef="timestamp">
          <th mat-header-cell *matHeaderCellDef>Zaman</th>
          <td mat-cell *matCellDef="let l" style="color:#9e9e9e;font-size:0.82rem">{{ l.timestamp | date:'dd.MM.yyyy HH:mm' }}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      @if (filtered.length === 0) {
        <div style="text-align:center;padding:40px;color:#9e9e9e">Kayıt bulunamadı</div>
      }
    </div>
  }
</div>
