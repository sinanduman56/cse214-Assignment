<div class="page-container">
  <div class="page-header">
    <h1>Profilim</h1>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
    <div class="chart-card">
      <h3>Hesap Bilgileri</h3>
      <form [formGroup]="form" (ngSubmit)="save()">
        <mat-form-field class="full-width" appearance="outline">
          <mat-label>E-posta</mat-label>
          <input matInput formControlName="email" />
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>

        <mat-form-field class="full-width" appearance="outline" style="margin-top:12px">
          <mat-label>Hesap Türü</mat-label>
          <input matInput formControlName="roleType" [value]="roleLabel(form.getRawValue().roleType)" />
          <mat-icon matPrefix>badge</mat-icon>
        </mat-form-field>

        <mat-form-field class="full-width" appearance="outline" style="margin-top:12px">
          <mat-label>Cinsiyet</mat-label>
          <mat-select formControlName="gender">
            <mat-option value="male">Erkek</mat-option>
            <mat-option value="female">Kadın</mat-option>
            <mat-option value="other">Diğer</mat-option>
          </mat-select>
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="saving" style="margin-top:12px">
          <mat-icon>save</mat-icon> Kaydet
        </button>
      </form>
    </div>

    <div class="chart-card">
      <h3>Hesap Özeti</h3>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;align-items:center;gap:12px;padding:16px;background:#f5f7fa;border-radius:8px">
          <div style="width:48px;height:48px;border-radius:50%;background:#1a237e;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4rem;font-weight:700">
            {{ auth.currentUser()?.email?.charAt(0)?.toUpperCase() }}
          </div>
          <div>
            <div style="font-weight:600">{{ auth.currentUser()?.email }}</div>
            <div style="font-size:0.8rem;color:#757575">{{ roleLabel(auth.currentUser()?.roleType ?? '') }}</div>
          </div>
        </div>

        <div style="padding:12px;background:#e8f5e9;border-radius:8px;display:flex;align-items:center;gap:8px">
          <mat-icon style="color:#2e7d32">check_circle</mat-icon>
          <span style="color:#2e7d32;font-weight:500">Hesabınız aktif</span>
        </div>
      </div>
    </div>
  </div>
</div>
