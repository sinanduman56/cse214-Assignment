<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="brand">🛒 ShopPlatform</div>
    <div class="nav-section">Menü</div>
    <a routerLink="dashboard" routerLinkActive="active" class="nav-item">
      <mat-icon>dashboard</mat-icon> Gösterge Paneli
    </a>
    <a routerLink="products" routerLinkActive="active" class="nav-item">
      <mat-icon>store</mat-icon> Ürünler
    </a>
    <a routerLink="stores" routerLinkActive="active" class="nav-item">
      <mat-icon>storefront</mat-icon> Mağazalar
    </a>
    <a routerLink="cart" routerLinkActive="active" class="nav-item">
      <mat-icon>shopping_cart</mat-icon> Sepetim
    </a>
    <a routerLink="orders" routerLinkActive="active" class="nav-item">
      <mat-icon>receipt_long</mat-icon> Siparişlerim
    </a>
    <div class="nav-section">Hesap</div>
    <a routerLink="profile" routerLinkActive="active" class="nav-item">
      <mat-icon>person</mat-icon> Profilim
    </a>
    <a routerLink="chat" routerLinkActive="active" class="nav-item">
      <mat-icon>smart_toy</mat-icon> AI Asistan
    </a>
    <div style="flex:1"></div>
    <div class="nav-item" (click)="auth.logout()" style="margin-top:auto;color:#ef9a9a;cursor:pointer">
      <mat-icon>logout</mat-icon> Çıkış Yap
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="main-toolbar">
      <span style="font-weight:600;color:#1a237e">Bireysel Panel</span>
      <span style="flex:1"></span>
      <span style="font-size:0.9rem;color:#757575">{{ auth.currentUser()?.email }}</span>
    </mat-toolbar>
    <div class="main-content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
